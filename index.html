<!DOCTYPE html>
<html lang="en">
<html>
    <head><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Scrimba Lab 2.1</title>
    
    </head>


    <body class="contact-page">

        <main id="main">
            <!-- Form section -->
            <div class="contact-form-section">
                <fieldset>
                <form>
                    <h1 class="contact-form-heading">Reach <span>Out</span></h1>
                    <h2 class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</h2>
                    
                    <label for="name-firstlast">Name</label>
                    <input id="name-firstlast" class="contact-input" type="text" placeholder="Jane Doe" />
                    
                    <label for="email-address">Email</label>
                    <input id="email-address" class="contact-input" type="text" placeholder="jane.doe@gmail.com" />
                    
                     <label for="written-message">Write a Messsage</label>
                    <textarea id="written-message" class="contact-textarea" rows="4" cols="50" placeholder="Hello, I would like to learn more!"></textarea>

                    <button class="contact-submit-button" type="button" onclick="submitForm()">Submit Message</button>
                </form>
                </fieldset>

                <img class="contact-image" src="images/connect.jpg" alt="Robot hand reaching down to an upwardly extended human hand"/>
            </div>
        
        </main>
    </body>
</html>
